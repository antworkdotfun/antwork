[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 400
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
# Robinhood Chain accepts contract code up to 98,304 bytes (Arbitrum Orbit setting), not the mainnet 24,576.
code_size_limit = 98304
# deployments/: the scripts write their records there. ../server/test/fixtures: the realm's voucher digest fixture,
# which test/Voucher.t.sol compares with the contract's own EIP-712 digest.
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "../server/test/fixtures" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1024

[invariant]
runs = 128
depth = 96
fail_on_revert = false

[lint]
lint_on_build = false
